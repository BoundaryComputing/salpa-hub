[project]
name = "pdbmdauto"
version = "1.2.0"
description = "Shared environment for PDBmdAuto workflow nodes"
channels = ["conda-forge", "bioconda"]
# win-64 is impossible, not merely undeclared: `No candidates were found for gromacs`.
# On Windows the app builds this environment inside WSL2 automatically (bocoflow#48,
# verified end-to-end; see dev-notes/wsl2-first-install-field-report.md in the dev repo).
# linux-aarch64 solves to the same package set as linux-64 and every dependency has an
# ARM build (bocoflow#105); osx-arm64 is native — no Rosetta.
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.9,<3.13"
pip = "*"
# Shared across homology modeling nodes
biopython = ">=1.80"
requests = "*"
# Redis for stream_log() in PIXI_SUBPROCESS
redis-py = ">=5.0.0"

# GROMACS for MD preparation nodes
gromacs = ">=2023"
promod3 = ">=3.5"            # fix_residues_promod3 (from bioconda, Apache 2.0)
# fix_residues_promod3 does `import ost` directly. Until 1.2.0 that import was satisfied
# only transitively, through promod3 — an undeclared dependency that works until the day
# promod3 restructures its own. Declared at the version the solve already resolves.
openstructure = ">=2.11"
# promod3 3.6.0 (built 2025-08-11) compiles against OpenMM's 8.3-8.5 ABI. Its own
# constraint (>=8.3.1,<9.0a0) is too loose: openmm 8.6.0 (2026-08-19) removed
# MonteCarloBarostat(double,double,int), so promod3's _sidechain.so fails to
# dlopen and the pipeline dies at FixResiduesPromod3 (bocoflow#130). Verified:
# 8.6.0 fails the import, 8.5.2 loads.
openmm = ">=8.3.1,<8.6"

# Protonation state prediction for pka_gmx_em
pdb2pqr = ">=3.0"            # PDB2PQR + PROPKA (pH-dependent protonation)
propka = ">=3.5"             # pKa predictor (dependency of pdb2pqr, explicit for clarity)

# Required by pdbmdauto's own members — pdb2pqr and
# pdb_fasta_biopython are full members of this package (listed in package.toml) and
# run in THIS shared env, exactly like every other member. Do NOT trim these:
# removing them breaks pdb2pqr at runtime (see issue #64). Their per-node pixi.toml
# files are vestigial and never read — the registry resolves shared_environment first.
pdb-tools = ">=2.5"          # was pdb_tools_clean's; that node is gone (issue #73) and
                             # nothing else calls the CLI. DELIBERATELY KEPT: the warning
                             # above is a scar from #64, where trimming this block broke
                             # pdb2pqr at runtime. Removing it is a separate change that
                             # needs an environment rebuild to verify, not a tidy-up.
mdanalysis = ">=2.0"         # pdb2pqr needs this at runtime

# NOTE: GromacsWrapper removed — `import gromacs` prints config NOTEs to stdout,
# corrupting node_runner JSON output. gen_gmx_ndx now writes NDX manually.

[tasks]
test = "pixi run -e dev pytest tests/ -v"

[feature.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"

[environments]
default = []
dev = ["dev"]
test = ["test"]

# The environment `salpa validate`'s import checks and `salpa smoke` look for.
#
# Without it both verbs SKIP on this package — they said so honestly and were
# never able to check a single node. The default environment carries the science
# tooling but deliberately has no bocoflow_core: the app injects the full runtime
# when it executes a node, and a copy in the default env would shadow it.
#
# `test` inherits the default feature, so it gets the science tooling AND the
# authoring API. The SDK belongs here and nowhere else.
[feature.test.dependencies]
pytest = ">=7.0"

[feature.test.pypi-dependencies]
bocoflow-core-sdk = ">=0.1.2"
