[package]
name = "gen-multi-chain-ali"
version = "1.0.0"
description = "Merge per-chain alignment files into a single multi-chain alignment for homology modeling"
author = "BoCoFlow Team"
license = "MIT"

[node]
class_name = "GenMultiChainAli"
display_name = "Multi-Chain Alignment"
shared_environment = "pdbmdauto"
num_in = 1
num_out = 1
hashtags = [
    "alignment",
    "multi-chain",
    "homology-modeling",
    "pdb",
    "structure-preparation",
    "promod3",
    "modeller",
    "chain-merge",
    "bioinformatics",
]

[node.metadata]
category = "Structure Preparation"
tooltip = "Merges per-chain .ali alignment files into a single multi-chain alignment. Chains are separated by '/' markers. DNA/RNA chains are masked with '.' characters."

[node.features]
supports_resume = false
requires_gpu = false
parallel_capable = false
long_running = false

[node.platforms]
supported = ["linux", "macos", "windows"]
