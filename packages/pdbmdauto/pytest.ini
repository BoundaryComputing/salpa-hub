[pytest]
# Run from the package root, pytest collects every test in the package: tests/ and
# each node's own tests/. `pixi run test` does exactly that, in the test environment.
testpaths =
    tests
    */tests

# importlib: each test module is imported under a name taken from its path, so two
# nodes' tests/test_core.py cannot collide, and pytest adds nothing to sys.path. A test
# that needs its node puts the package root there itself and imports `<node>.core`.
# -rs lists every skip with its reason, so a test that silently stopped running shows.
addopts = --import-mode=importlib -rs
