# Pixi environment for GROMACS MD Run node
# This enables isolated execution via PIXI_SUBPROCESS strategy

[project]
name = "gmx-mdrun"
version = "2.0.0"
description = "GROMACS MD simulation node with local and HPC/SLURM execution support"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
# Python runtime
python = ">=3.9,<3.13"

# GROMACS from conda-forge
# Note: Windows builds are limited, hence platform restriction above
gromacs = ">=2023"

# =============================================================================
# bocoflow-core (HPCNodeBase, parameters, logging) is NOT declared as a
# dependency here. At runtime PixiManager pip-installs the bundled bocoflow-core
# into this node's environment — the same mechanism every sibling pdbmdauto node
# relies on — so node.py imports resolve without a pin. The earlier private git
# pin was standalone-test scaffolding, not needed for the shipped product;
# Level-2 node tests skip gracefully when bocoflow_core is absent from a bare
# per-node env. See: dev-notes/marketplace-node-dependency-management.md
# =============================================================================

[tasks]
# Task to run a simulation (example usage)
run = { cmd = "python -m gmx_mdrun" }

# Check GROMACS installation
check = { cmd = "gmx --version" }

# Run tests
test = { cmd = "pytest tests/ -v" }

[feature.dev.dependencies]
# Development dependencies (not required for node execution)
pytest = ">=7.0"
pytest-cov = "*"

[environments]
# Default environment for running nodes (no dev deps)
default = []
# Development environment with test dependencies
dev = ["dev"]
