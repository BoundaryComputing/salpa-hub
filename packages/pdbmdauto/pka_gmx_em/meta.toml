[package]
name = "pka-gmx-em"
version = "1.0.1"
description = "pH-dependent protonation (PDB2PQR/PROPKA) + GROMACS topology (pdb2gmx) + two-step vacuum energy minimisation"
author = "BoundaryComputing"
license = "MIT"

[package.dependencies]
pdb2pqr = ">=3.0.0"
gromacs = ">=2023"

[node]
class_name = "PkaGmxEm"
display_name = "pKa + GROMACS EM"
shared_environment = "pdbmdauto"
num_in = 1
num_out = 1

hashtags = [
    "protonation",
    "propka",
    "pdb2pqr",
    "gromacs",
    "pdb2gmx",
    "energy-minimisation",
    "structure-preparation",
    "force-field",
    "molecular-dynamics",
    "protein-preparation",
]

[node.metadata]
category = "Molecular Dynamics"
tooltip = "Predicts protonation states at target pH via PROPKA, generates GROMACS topology with correct residue naming, and runs two-step vacuum energy minimisation."
tags_display = ["PROPKA", "pdb2gmx", "Energy Min", "GROMACS"]

[node.features]
supports_resume = false
requires_gpu = false
parallel_capable = false
long_running = true
default_timeout = 1800              # 30 min — protonation + pdb2gmx + 2-step EM

[node.platforms]
# Windows is served through WSL2, which the app sets up itself; the environment has no
# native win-64 solve (GROMACS/ProMod3), so this list names the native platforms only.
supported = ["linux", "macos"]
