# Pixi Environment for pdb-tools-clean
# pdb-tools is available on conda-forge

[project]
name = "pdb-tools-clean"
version = "1.0.0"
description = "PDB file cleaning using pdb-tools"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.9,<3.13"

# pdb-tools suite from conda-forge
# https://anaconda.org/conda-forge/pdb-tools
pdb-tools = ">=2.5.0"

[tasks]
# Test the pdb-tools installation
test-install = "pdb_fetch --help"

# Run unit tests
test = "pytest tests/ -v"

# Example: fetch and clean a PDB
example = """
pdb_fetch 1brs > /tmp/1brs.pdb && \
pdb_selchain -A,D /tmp/1brs.pdb | pdb_delhetatm | pdb_tidy > /tmp/1brs_clean.pdb && \
echo 'Cleaned PDB saved to /tmp/1brs_clean.pdb'
"""

[feature.dev.dependencies]
pytest = ">=7.0"
