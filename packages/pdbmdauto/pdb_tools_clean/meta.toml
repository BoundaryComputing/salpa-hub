# PDB Tools Clean - Node Package Metadata

[package]
name = "pdb-tools-clean"
version = "1.0.0"
description = "Clean PDB files by selecting chains, removing HETATM records, and tidying format"
author = "BoCoFlow Community"
license = "MIT"
repository = "https://github.com/BoundaryComputing/salpa-hub"
homepage = "https://www.bonvinlab.org/pdb-tools/"

[node]
class_name = "PDBToolsClean"
display_name = "PDB Clean (pdb-tools)"
shared_environment = "pdbmdauto"
node_type = "manipulation"
num_in = 1
num_out = 1
color = "#06B6D4"  # Cyan for structure manipulation

# Hashtags for discovery and categorization
hashtags = [
    # Primary functionality
    "pdb-cleaning",
    "structure-preparation",
    "chain-selection",

    # Tool
    "pdb-tools",
    "haddocking",

    # Operations
    "remove-hetatm",
    "remove-water",
    "remove-ligands",
    "tidy-pdb",
    "renumber-residues",

    # Scientific domain
    "structural-biology",
    "molecular-dynamics-prep",
    "protein-structure",

    # File types
    "pdb-input",
    "pdb-output",

    # Workflow category
    "preprocessing",
    "structure-cleanup",
]

[node.metadata]
icon = "icon.svg"
tooltip = "Clean and prepare PDB files using pdb-tools"
category = "Structure Preparation"
tags_display = ["pdb-tools", "Clean", "Chains", "HETATM"]

[node.features]
supports_resume = false
requires_gpu = false
parallel_capable = true
long_running = false
estimated_runtime = "< 5 seconds"

# Kept deliberately, unlike the other members' blocks (#65).
# Multi-node members normally declare no dependencies — theirs live in the shared
# pixi.toml — and the python-only blocks on the other members were removed because
# node_schema/extractor.py filters `python` out, making them provably inert.
# This one also carries pdb-tools, which the extractor DOES surface to the Copilot,
# so removing it would lose real information about what this node uses.
[dependencies]
python = ">=3.9"
pdb-tools = ">=2.5.0"

[compatibility]
platforms = ["linux", "macos", "windows"]
tested_on = ["ubuntu-22.04", "macos-14"]
cpu_architectures = ["x86_64", "arm64"]

[documentation]
readme = "README.md"

[citation]
reference = "pdb-tools: a swiss army knife for molecular structures"
authors = "Rodrigues et al."
journal = "F1000Research"
year = "2018"
doi = "10.12688/f1000research.17456.1"
url = "https://github.com/haddocking/pdb-tools"
