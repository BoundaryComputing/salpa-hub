[package]
name = "ori-ndx-builder"
version = "1.0.1"
description = "Build GROMACS index groups (OriHeavy, OriBackBone) for original vs homology-modeled residues"
author = "BoundaryComputing"
license = "MIT"

[node]
class_name = "OriNdxBuilder"
display_name = "Original Atom Groups"
shared_environment = "pdbmdauto"
num_in = 1
num_out = 1
hashtags = [
    "gromacs", "index", "ndx", "molecular-dynamics",
    "restraints", "homology-modeling", "freeze-groups",
    "structure-preparation", "position-restraints",
]

[node.metadata]
category = "Molecular Dynamics"
tooltip = "Identifies original (crystallographic) vs homology-modeled atoms. Creates OriHeavy and OriBackBone GROMACS index groups for freezegrps during vacuum relaxation."

[node.features]
supports_resume = false
requires_gpu = false
parallel_capable = false
long_running = false

[node.platforms]
# Windows is served through WSL2, which the app sets up itself; the environment has no
# native win-64 solve (GROMACS/ProMod3), so this list names the native platforms only.
supported = ["linux", "macos"]
