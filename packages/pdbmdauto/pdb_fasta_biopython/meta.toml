[package]
name = "pdb-fasta-biopython"
version = "2.0.1"
description = "Parse PDB structures and extract FASTA sequences using BioPython. Supports RCSB PDB API fetching by ID and local file processing with chain splitting, HETATM handling, and missing residues analysis."
author = "BoundaryComputing"
license = "MIT"

[package.dependencies]
biopython = ">=1.80"
requests = ">=2.28"

[node]
class_name = "PdbFastaBiopython"
display_name = "PDB FASTA Parser"
shared_environment = "pdbmdauto"
# num_in/num_out omitted — defaults to 1

hashtags = [
    "pdb",
    "fasta",
    "sequence-extraction",
    "biopython",
    "structure-to-sequence",
    "protein-sequence",
    "chain-extraction",
    "file-conversion",
    "rcsb-api",
    "missing-residues",
    "structural-biology",
    "bioinformatics",
    "preprocessing",
]

[node.metadata]
icon = "icon.svg"
tooltip = "Parse PDB structures and extract FASTA sequences — supports RCSB API fetch and local files"
category = "Bioinformatics"
tags_display = ["BioPython", "PDB", "FASTA", "RCSB"]

[node.features]
supports_resume = false
requires_gpu = false
parallel_capable = false
long_running = false


[compatibility]
platforms = ["linux", "macos", "windows"]

[documentation]
readme = "README.md"

[node.platforms]
# Windows is served through WSL2, which the app sets up itself; the environment has no
# native win-64 solve (GROMACS/ProMod3), so this list names the native platforms only.
supported = ["linux", "macos"]
