[package]
name = "mdock-results-analysis"
version = "0.2.0"
description = "Binding energies, ligand efficiency, interacting residues, and RMSD from docking output — MetalDock pipeline step 6"
author = "BoCoFlow / MetalDock"
license = "LGPL-2.1"

[node]
class_name = "MdockResultsAnalysis"
display_name = "Results Analysis"
shared_environment = "metaldock_vwf"
num_in = 1
num_out = 1
category = "Metal Docking"

hashtags = [
    "metaldock",
    "analysis",
    "binding-energy",
    "ligand-efficiency",
    "interacting-residues",
    "rmsd",
    "molecular-docking",
    "computational-chemistry",
]

[node.metadata]
tooltip = "Parse binding energies, ligand efficiency, interacting residues, and RMSD"

[node.features]
supports_resume = false
requires_gpu = false
parallel_capable = false
long_running = false
