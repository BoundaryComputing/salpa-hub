<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MetalDock 1JZI Re Docking Workflow — slide</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #07091a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", sans-serif; }
  .frame  { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
  .slide  { width: 100%; max-width: 1920px; aspect-ratio: 16 / 9; background:
              radial-gradient(circle at 18% 15%, #1f2a55 0%, transparent 60%),
              radial-gradient(circle at 90% 85%, #2a1850 0%, transparent 55%),
              linear-gradient(180deg, #0b1230 0%, #06091e 100%);
            border: 1px solid #2c3a66; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; position: relative; }
  svg     { width: 100%; height: 100%; display: block; }
  .t-title { font: 800 56px -apple-system, "Inter", sans-serif; fill: #ffffff; letter-spacing: -0.5px; }
  .t-sub   { font: 500 22px -apple-system, "Inter", sans-serif; fill: #94a8da; }
  .t-lane  { font: 700 14px -apple-system, "Inter", sans-serif; fill: #6e84bd; letter-spacing: 4px; }
  .t-io    { font: 600 17px -apple-system, "Inter", sans-serif; fill: #9fb2e2; }
  .t-io b  { fill: #ffffff; font-weight: 700; }
  .t-node  { font: 700 16px -apple-system, "Inter", sans-serif; fill: #0c1530; text-anchor: middle; dominant-baseline: central; }
  .t-prefix{ font: 700 9px -apple-system, "Inter", sans-serif; fill: #0c1530; opacity: 0.55; text-anchor: middle; dominant-baseline: central; letter-spacing: 1.2px; }
  .t-cap   { font: 500 14px -apple-system, "Inter", sans-serif; fill: #8fa3d6; text-anchor: middle; }
  .t-step  { font: 800 13px -apple-system, "Inter", sans-serif; fill: #6e84bd; text-anchor: middle; }
  .t-legend-h { font: 700 13px -apple-system, "Inter", sans-serif; fill: #6e84bd; letter-spacing: 3px; }
  .t-list  { font: 500 16px -apple-system, "Inter", sans-serif; fill: #c2cef0; }
  /* bold spans — must be <tspan class="b-w">, NOT <tspan class="b-w">: an HTML <tspan class="b-w"> inside an
     SVG <text> triggers the HTML foreign-content breakout and terminates the
     <svg> early, dropping every element after it. */
  .b-w     { font-weight: 700; fill: #ffffff; }
  .t-list .hl-qm   { fill: #fdba74; font-weight: 700; }
  .t-list .hl-res  { fill: #fde047; font-weight: 700; }
  .t-meta  { font: 500 14px -apple-system, "Inter", sans-serif; fill: #6e84bd; }
  .t-badge { font: 700 18px -apple-system, "Inter", sans-serif; fill: #d9f99d; }
  .t-badge b { fill: #ffffff; }
  .edge    { fill: none; stroke: #5469ad; stroke-width: 2.4; }
  .div     { stroke: #2a3970; stroke-width: 1; }
  .callout { fill: rgba(132,204,22,0.08); stroke: #4d7c0f; stroke-width: 1.2; }
</style>
</head>
<body>
<div class="frame"><div class="slide">
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7e94d1"/>
    </marker>
    <linearGradient id="g-prot"  x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bbf7d0"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
    <linearGradient id="g-lig"   x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="g-qm"    x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="g-pdbqt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="g-dock"  x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="g-res"   x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#facc15"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title block -->
  <text class="t-title" x="80"  y="88">MetalDock — 1JZI Re Docking Workflow</text>
  <text class="t-sub"   x="80"  y="124">6 nodes · 5 edges · refactored MetalDock pipeline  ·  <tspan fill="#7d92cd">workflows/1jzi-re-docking/workflow.bcflow</tspan></text>
  <line class="div" x1="80" y1="152" x2="1840" y2="152"/>

  <!-- Lane label + inputs -->
  <text class="t-lane" x="80" y="232">REFACTORED METALDOCK PIPELINE · LINEAR DAG</text>
  <text class="t-io"   x="80" y="300"><tspan fill="#6e84bd">inputs ▸ </tspan><tspan class="b-w">1jzi.pdb</tspan> (azurin receptor)  ·  <tspan class="b-w">1jzi_D_REP.xyz</tspan> (Re(phen)(CO)₃ complex, metal = Re)</text>

  <!-- ============ Edges (linear chain) ============ -->
  <line class="edge" x1="296"  y1="458" x2="392"  y2="458" marker-end="url(#arr)"/>
  <line class="edge" x1="596"  y1="458" x2="692"  y2="458" marker-end="url(#arr)"/>
  <line class="edge" x1="896"  y1="458" x2="992"  y2="458" marker-end="url(#arr)"/>
  <line class="edge" x1="1196" y1="458" x2="1292" y2="458" marker-end="url(#arr)"/>
  <line class="edge" x1="1496" y1="458" x2="1592" y2="458" marker-end="url(#arr)"/>

  <!-- ============ Nodes (6, single row, y=430) ============ -->
  <text class="t-step" x="196"  y="408">STEP 1</text>
  <g filter="url(#shadow)"><rect x="96"   y="430" width="200" height="56" rx="12" fill="url(#g-prot)"/><text class="t-prefix" x="196"  y="445">PROTEIN PREP</text><text class="t-node" x="196"  y="468">protein_prep</text></g>
  <text class="t-cap" x="196"  y="525">clean · pdb2pqr · PDBQT</text>

  <text class="t-step" x="496"  y="408">STEP 2</text>
  <g filter="url(#shadow)"><rect x="396"  y="430" width="200" height="56" rx="12" fill="url(#g-lig)"/><text class="t-prefix" x="496"  y="445">LIGAND PREP</text><text class="t-node" x="496"  y="468">ligand_prep</text></g>
  <text class="t-cap" x="496"  y="525">canonicalize XYZ · build graph</text>

  <text class="t-step" x="796"  y="408">STEP 3</text>
  <g filter="url(#shadow)"><rect x="696"  y="430" width="200" height="56" rx="12" fill="url(#g-qm)"/><text class="t-prefix" x="796"  y="445">QM · ORCA</text><text class="t-node" x="796"  y="468">qm_charges</text></g>
  <text class="t-cap" x="796"  y="525">DFT → CM5 charges + bond orders</text>

  <text class="t-step" x="1096" y="408">STEP 4</text>
  <g filter="url(#shadow)"><rect x="996"  y="430" width="200" height="56" rx="12" fill="url(#g-pdbqt)"/><text class="t-prefix" x="1096" y="445">PDBQT</text><text class="t-node" x="1096" y="468">ligand_pdbqt</text></g>
  <text class="t-cap" x="1096" y="525">ROOT/BRANCH · metal-aware torsions</text>

  <text class="t-step" x="1396" y="408">STEP 5</text>
  <g filter="url(#shadow)"><rect x="1296" y="430" width="200" height="56" rx="12" fill="url(#g-dock)"/><text class="t-prefix" x="1396" y="445">DOCKING</text><text class="t-node" x="1396" y="468">autodock_run</text></g>
  <text class="t-cap" x="1396" y="525">autogrid4 + autodock4 → poses</text>

  <text class="t-step" x="1696" y="408">STEP 6</text>
  <g filter="url(#shadow)"><rect x="1596" y="430" width="200" height="56" rx="12" fill="url(#g-res)"/><text class="t-prefix" x="1696" y="445">ANALYSIS</text><text class="t-node" x="1696" y="468">results_analysis</text></g>
  <text class="t-cap" x="1696" y="525">ΔG · ligand efficiency · residues · RMSD</text>

  <!-- ============ Data-flow note ============ -->
  <text class="t-meta" x="80" y="588">Each node forwards its predecessor's data and appends its own; the molecular graph is serialized as JSON between nodes (utils.save_graph / load_graph).</text>

  <!-- ============ Result callout ============ -->
  <g transform="translate(80, 620)">
    <rect class="callout" x="0" y="0" width="1760" height="92" rx="14"/>
    <text class="t-badge" x="28" y="40">✓ Verified live</text>
    <text class="t-meta"  x="28" y="68">node-by-node and single “Run Workflow” (orchestrator) runs, both on the live BoCoFlow GUI</text>
    <text class="t-badge" x="900" y="40"><tspan fill="#9fb2e2" font-weight="500">best docking ΔG </tspan><tspan class="b-w">−5.55 kcal/mol</tspan><tspan fill="#9fb2e2" font-weight="500"> · 3 poses</tspan></text>
    <text class="t-meta"  x="900" y="68">matches the MetalDock paper / repo validation (−5.54 kcal/mol)</text>
  </g>

  <!-- ============ Legend (categories) ============ -->
  <g transform="translate(80, 770)">
    <text class="t-legend-h" x="0" y="0">CATEGORIES</text>
    <g transform="translate(0, 18)">
      <rect x="0"   y="0" width="14" height="14" rx="3" fill="url(#g-prot)"/> <text class="t-meta" x="22"  y="11">protein prep</text>
      <rect x="150" y="0" width="14" height="14" rx="3" fill="url(#g-lig)"/>  <text class="t-meta" x="172" y="11">ligand prep</text>
      <rect x="300" y="0" width="14" height="14" rx="3" fill="url(#g-qm)"/>   <text class="t-meta" x="322" y="11">QM charges (ORCA)</text>
      <rect x="510" y="0" width="14" height="14" rx="3" fill="url(#g-pdbqt)"/><text class="t-meta" x="532" y="11">ligand PDBQT</text>
      <rect x="680" y="0" width="14" height="14" rx="3" fill="url(#g-dock)"/> <text class="t-meta" x="702" y="11">AutoDock4 docking</text>
      <rect x="880" y="0" width="14" height="14" rx="3" fill="url(#g-res)"/>  <text class="t-meta" x="902" y="11">results analysis</text>
    </g>
  </g>

  <!-- ============ Bottom strip: full node list ============ -->
  <line class="div" x1="80" y1="936" x2="1840" y2="936"/>
  <text class="t-legend-h" x="80" y="966">NODES (6)  ·  metaldock-vwf</text>
  <text class="t-list" x="80" y="1004"><tspan class="b-w">1.</tspan> protein_prep · <tspan class="b-w">2.</tspan> ligand_prep · <tspan class="b-w">3.</tspan> <tspan class="hl-qm">qm_charges</tspan> · <tspan class="b-w">4.</tspan> ligand_pdbqt · <tspan class="b-w">5.</tspan> autodock_run · <tspan class="b-w">6.</tspan> <tspan class="hl-res">results_analysis</tspan></text>
</svg>
</div></div>
</body>
</html>
