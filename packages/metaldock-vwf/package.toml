[package]
name = "metaldock-vwf"
version = "0.4.0"
description = "Visual workflow nodes for metal-protein docking: the refactored MetalDock pipeline (protein prep, ligand prep, QM/ORCA CM5 charges, ligand PDBQT with metal-aware torsion tree, AutoDock4 docking, results analysis) wired as chainable Salpa nodes. Each node wraps one src/metaldock_modules function; molecular graphs are serialized to JSON between nodes."
author = "BoundaryComputing / MetalDock"
license = "LGPL-2.1 (non-commercial: MGLTools)"
repository = "https://github.com/BoundaryComputing/salpa-hub"

[package.nodes]
nodes = [
    "mdock_protein_prep",      # clean PDB → pdb2pqr protonate → prepare_receptor4 PDBQT
    "mdock_ligand_prep",       # canonicalize XYZ (obabel) → build molecular graph
    "mdock_qm_charges",        # ORCA/Gaussian/ADF DFT → CM5 charges + Mayer bond orders → enrich graph
    "mdock_ligand_pdbqt",      # enriched graph → ROOT/BRANCH PDBQT (metal-aware torsion freezing)
    "mdock_autodock_run",      # GPF/DPF → autogrid4 → autodock4 → extract poses
    "mdock_results_analysis",  # binding energies, ligand efficiency, interacting residues, RMSD
]

[package.environment]
shared_environment = "metaldock_vwf"

[package.metadata]
category = "Metal Docking"
keywords = [
    "metaldock",
    "molecular-docking",
    "metal-complex",
    "autodock4",
    "qm-charges",
    "cm5",
    "orca",
    "metalloprotein",
    "computational-chemistry",
]
hashtags = [
    "metaldock",
    "molecular-docking",
    "metal-docking",
    "metal-complex",
    "autodock4",
    "autogrid4",
    "qm-derived-charges",
    "cm5-charges",
    "orca",
    "pdb2pqr",
    "mgltools",
    "pdbqt",
    "metalloprotein",
    "transition-metal",
    "computational-chemistry",
]
platform_note = "Runs on Linux and on Mac. On Apple Silicon it runs through Rosetta, which macOS installs on request — if Salpa says Rosetta is missing, run 'softwareupdate --install-rosetta --agree-to-license' and try again. Windows needs WSL2 or Docker. MGLTools and AutoDock4 ship x86_64 builds only, which is why Rosetta is involved. Everything the bundled demo needs is installed for you, QM charges included: the default engine is GFN1-xTB. ORCA remains the DFT accuracy reference and is downloaded separately (free for academic use), then pointed at via mdock_qm_charges' orca_path."

[package.documentation]
readme = "README.md"
# Two registers, deliberately separate: README.md is the formal reference (scope,
# methodology, node table, references); TUTORIAL.md is the plain-language lesson for
# a wet-lab audience with no simulation background. Mixing them serves neither.
tutorial = "TUTORIAL.md"

# The installable example. Produced by the app's own
# /api/workflow/{id}/export-template endpoint from a workflow that was built,
# configured and RUN in the UI — not hand-written JSON, which imports but whose
# edges never paint (see CHANGELOG 0.2.1). Every input is a `node:` path into a
# node's own demo_data and every output a `rel:` path under the workflow's
# working directory, so it carries no trace of the machine that made it.
[package.workflows]
# The HSA case is the default example: it docks into a protein with no complex
# bound, which is what a user actually does.
#
# The 1JZI case is a REDOCKING — the ligand is lifted out of a solved structure
# and put back. It reproduces the published MetalDock result, which is why
# workflows/metaldock-1jzi-re-pipeline.json and its notes stay in this repo, but
# it is not what someone reaches for when they have a target and a ligand. It is
# deliberately absent from `examples` so it does not ship as a Hub template
# alongside a case that answers a real question; the site already excludes its
# doc for the same reason.
examples = [
    "workflows/metaldock-hsa-ferrocene.json",
]
