# Cloud Modal Chai-1 - Pixi Environment
# Minimal dependencies: requests for API calls, redis-py for stream_log()
# Auto-detected by Node base class → PIXI_SUBPROCESS execution strategy

[project]
name = "cloud-modal-chai1"
version = "1.0.0"
description = "Chai-1 cloud node — Modal H100 GPU client stub"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.9,<3.13"
pip = ">=23.0"
requests = ">=2.31"
redis-py = ">=5.0.0"

[tasks]
run = "python -m bocoflow_core.node_runner"
test = "python -c \"from node import CloudModalChai1; print('Node loaded successfully')\""
