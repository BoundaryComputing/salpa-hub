# Cloud Modal DiffDock - Pixi Environment
# Minimal dependencies: requests for API calls, redis-py for stream_log()
# Auto-detected by Node base class -> PIXI_SUBPROCESS execution strategy
# All computation happens on Modal A10G GPU

[project]
name = "cloud-modal-diffdock"
version = "1.0.0"
description = "DiffDock docking on Modal A10G GPU (BoCoFlow Credits)"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
# Python runtime - MUST constrain to avoid bleeding-edge versions
python = ">=3.9,<3.13"

# pip is REQUIRED for installing bocoflow-core via editable install
pip = ">=23.0"

# Node dependencies
requests = ">=2.31"
redis-py = ">=5.0.0"

# Note: bocoflow-core is automatically installed by PixiManager
# during environment creation via editable install from the local path

[tasks]
run = "python -m bocoflow_core.node_runner"
