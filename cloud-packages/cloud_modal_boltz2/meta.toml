# Cloud Modal Boltz-2 - a Salpa Compute node
# Protein structure prediction using Boltz-2 on Modal H100 GPU
# This is a client stub that calls the Salpa Compute gateway, not Modal directly.

[package]
name = "cloud-modal-boltz2"
version = "1.0.7"
description = "Protein structure prediction using Boltz-2 on Modal H100 GPU"
author = "BoundaryComputing"
license = "MIT"

[node]
shared_environment = "cloud-client"
class_name = "CloudModalBoltz2"
display_name = "Boltz-2 Prediction (Modal)"
node_type = "cloud"
category = "protein"
num_in = 1
num_out = 1
color = "purple"

# cloud-modal hashtag indicates a Salpa Compute node on Modal
# UI can use this to show cloud/credits indicator
hashtags = [
    "cloud-modal",
    "protein",
    "structure-prediction",
    "boltz2",
    "gpu",
    "ai",
    "h100",
]

[node.metadata]
icon = "🧬"

[node.features]
# The timeout a new node starts with (seconds): Boltz-2's 30-minute limit, a cold start and the download.
# A node already saved in a workflow keeps the timeout it was saved with.
default_timeout = 2400

[node.cloud]
provider = "modal"
credential_mode = "bocoflow"  # Mode B - NOT "user"
# api_gateway_endpoint = "/api/cloud/nodes/boltz2/execute"
credits_per_call = 0.50
estimated_duration = "3-10 minutes"
requires_login = true
requires_gpu = true
gpu_type = "H100"

[dependencies]
python = ">=3.9"
requests = ">=2.31.0"

[documentation]
usage = """
Boltz-2 is a state-of-the-art protein structure prediction model.

Input: Protein amino acid sequence (one-letter codes)
Output: 3D structure prediction in CIF format, with confidence and pLDDT,
plus the full result as a tarball in the workflow folder. A result too large
for the reply is downloaded from Salpa Compute and then deleted there; an
archive nobody downloads is deleted within 24 hours.

Example sequence:
MVLSPADKTNVKAAWGKVGAHAGEYGAEALERMFLSFPTTKTYFPHFDLSH

This node runs on Modal's H100 GPU infrastructure and typically
takes 3-10 minutes depending on sequence length.
"""
reference = "https://modal.com/docs/examples/boltz_predict"
